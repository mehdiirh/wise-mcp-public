<!doctype html><html><head><meta charset="utf-8"><title>Wise UI preview</title>
<style>body{background:#e8edf2;margin:24px;font:14px system-ui}header{margin:16px auto;max-width:960px}
iframe{display:block;border:0;width:100%;height:900px;max-width:960px;margin:auto;border-radius:16px}
button{padding:8px 14px;margin:5px;border:1px solid #a9b8c7;border-radius:8px;cursor:pointer}</style>
</head><body><header><b>Synthetic preview — no account connected</b><p>
<button onclick="show('cards')">Account cards</button><button onclick="show('chart')">Statistics</button>
<button onclick="show('table')">Ad table</button><button onclick="show('empty')">Empty</button>
<button onclick="show('error')">Error</button><button onclick="dark()">Toggle theme</button>
</p></header><iframe id="app" src="/results.html" title="Wise results" sandbox="allow-scripts"></iframe>
<script>
const app=document.getElementById('app');let mode='cards',theme='light';
function send(method,params){app.contentWindow.postMessage({jsonrpc:'2.0',method,params},'*');}
function dark(){theme=theme==='light'?'dark':'light';send('ui/notifications/host-context-changed',{theme});}
function show(view){mode=view;let data;
if(view==='cards')data={balance:245000,ads_count:12,overall_views:1284200,overall_clicks:18642,yesterday_views:38420,yesterday_clicks:563};
if(view==='chart')data=Array.from({length:14},(_,i)=>({datetime:`2026-10-${String(i+1).padStart(2,'0')}T00:00:00Z`,views:3000+i*250+(i%3)*600,clicks:40+i*7,joins:12+i*2}));
if(view==='table')data=[{title:'Autumn campaign',ad_code:'ab123456',status:'ACTIVE',views:124500,clicks:1520,balance:12000},{title:'Product launch',ad_code:'cd123456',status:'IN_REVIEW',views:0,clicks:0,balance:50000},{title:'<img src=x onerror=alert(1)>',ad_code:'ef123456',status:'STOPPED',views:4200,clicks:97,balance:null}];
if(view==='empty')data=[];
const result=view==='error'?{isError:true,content:[{type:'text',text:'Wise API did not respond in time'}]}:{structuredContent:{data,extra:null,meta:{success:true,status:200}},_meta:{'wise/view':view,'wise/title':view==='chart'?'Campaign performance':view==='cards'?'Account summary':'Your advertisements'}};
send('ui/notifications/tool-input',{arguments:{}});send('ui/notifications/tool-result',result);}
window.addEventListener('message',e=>{if(e.source!==app.contentWindow)return;const m=e.data;
if(m.method==='ui/initialize')app.contentWindow.postMessage({jsonrpc:'2.0',id:m.id,result:{protocolVersion:'2026-01-26',hostInfo:{name:'Local preview',version:'1'},hostCapabilities:{},hostContext:{theme}}},'*');
if(m.method==='ui/notifications/initialized')show(mode);
});
</script></body></html>
